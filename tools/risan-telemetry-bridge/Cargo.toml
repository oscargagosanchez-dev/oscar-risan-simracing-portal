[package]
name = "risan-telemetry-bridge"
version = "0.6.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
risan-lmu-data-bridge-core = { path = "../../shared/risan-lmu-data-bridge-core" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
