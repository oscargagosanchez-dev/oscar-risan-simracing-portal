<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noticia · Oscar Risan SimRacing</title><link rel="stylesheet" href="/styles.css"><style>body{background:#0b0d10;color:#fff}.article-wrap{max-width:900px;margin:0 auto;padding:32px 18px 70px}.article-back{display:inline-block;margin-bottom:22px;color:#fff;text-decoration:none}.article-hero{width:100%;max-height:460px;object-fit:cover;border-radius:18px;margin:16px 0}.article-meta{opacity:.7;font-size:.95rem;margin-bottom:12px}.article-wrap h1{font-size:clamp(2rem,6vw,4rem);line-height:1.02;margin:.2em 0}.article-summary{font-size:1.15rem;line-height:1.65;color:#d7dce2}.article-source{margin-top:28px;padding-top:20px;border-top:1px solid #2a2f36}.article-source a{color:#fff}.article-empty{padding:50px 0;color:#bbb}</style></head><body><main class="article-wrap"><a class="article-back" href="/">← Volver al portal</a><div id="article"><div class="article-empty">Cargando noticia…</div></div></main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/news').then(r=>r.json()).then(d=>{const n=(d.items||[]).find(x=>String(x.id)===String(id)),el=document.querySelector('#article');if(!n){el.innerHTML='<div class="article-empty">Esta noticia ya no está disponible.</div>';return}document.title=`${n.title} · Oscar Risan SimRacing`;el.innerHTML=`<div class="article-meta">${esc(n.category)} · ${n.date?new Date(n.date).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):''}</div><h1>${esc(n.title)}</h1>${n.image?`<img class="article-hero" src="${esc(n.image)}" alt="" onerror="this.remove()">`:''}<p class="article-summary">${esc(n.summary||'')}</p><div class="article-source">Fuente: ${esc(n.source||'Fuente oficial')} ${n.sourceUrl?`· <a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">Ver publicación original</a>`:''}</div>`}).catch(()=>document.querySelector('#article').innerHTML='<div class="article-empty">No se pudo cargar la noticia.</div>');</script></body></html>
