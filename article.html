<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Noticia · Oscar Risan SimRacing</title><link rel="stylesheet" href="/styles.css"><style>body{background:#0b0d10;color:#fff}.article-wrap{max-width:980px;margin:0 auto;padding:42px 24px 90px}.article-back{display:inline-flex;align-items:center;min-height:40px;margin-bottom:26px;color:#fff;text-decoration:none;font-weight:800}.article-shell{max-width:780px;margin:0 auto}.article-hero{width:100%;max-height:480px;object-fit:cover;border-radius:20px;margin:24px 0 28px;border:1px solid #252c35}.article-meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:#9ba6b3;font-size:.9rem;line-height:1.5;margin-bottom:18px}.article-wrap h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:1.06;letter-spacing:-.035em;margin:0 0 22px}.article-summary{font-size:1.14rem;line-height:1.85;color:#d2d9e1;margin:0;white-space:pre-line}.article-summary::first-line{color:#eef2f6}.article-source{margin-top:36px;padding-top:22px;border-top:1px solid #2a2f36;color:#9aa5b1;line-height:1.6}.article-source a{color:#fff;font-weight:800}.article-empty{padding:50px 0;color:#bbb}@media(max-width:620px){.article-wrap{padding:24px 17px calc(86px + env(safe-area-inset-bottom))}.article-back{margin-bottom:20px;font-size:.9rem}.article-shell{max-width:none}.article-meta{font-size:.78rem;margin-bottom:14px;gap:5px 10px}.article-wrap h1{font-size:clamp(1.85rem,9vw,2.65rem);line-height:1.1;letter-spacing:-.025em;margin-bottom:18px}.article-hero{margin:18px 0 22px;border-radius:15px;max-height:340px}.article-summary{font-size:1rem;line-height:1.78;color:#d1d8e0}.article-source{font-size:.84rem;margin-top:28px;padding-top:18px}}</style><link rel="stylesheet" href="/news-editorial.css"></head><body><main class="article-wrap"><a class="article-back" href="/">← Volver al portal</a><div class="article-shell"><div id="article"><div class="article-empty">Cargando noticia…</div></div></div></main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/news').then(r=>r.json()).then(d=>{const n=(d.items||[]).find(x=>String(x.id)===String(id)),el=document.querySelector('#article');if(!n){el.innerHTML='<div class="article-empty">Esta noticia ya no está disponible.</div>';return}document.title=`${n.title} · Oscar Risan SimRacing`;el.innerHTML=`<div class="article-meta"><span>${esc(n.category)}</span><span>${n.date?new Date(n.date).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):''}</span><span>${esc(n.source||'Fuente oficial')}</span></div><h1>${esc(n.title)}</h1>${n.image?`<img class="article-hero" src="${esc(n.image)}" alt="" onerror="this.remove()">`:''}<p class="article-summary">${esc(n.summary||'')}</p><div class="article-source">Fuente: ${esc(n.source||'Fuente oficial')} ${n.sourceUrl?`· <a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">Ver publicación original</a>`:''}</div>`}).catch(()=>document.querySelector('#article').innerHTML='<div class="article-empty">No se pudo cargar la noticia.</div>');</script></body></html>
